    <main id="main">
      <section aria-labelledby="gallery-heading">
        <h1 id="gallery-heading">Gallery</h1>
        <p class="muted">A responsive grid of images using semantic <code>&lt;figure&gt;</code> markup.</p>

        <div class="card">
          <div class="gallery" aria-label="Image gallery">
            <figure>
              <img
                src="../assets/img/gallery/skye-storr.jpg"
                alt="Isle of Skye — The Old Man of Storr rock formation"
                loading="lazy"
              />
              <figcaption class="muted">Isle of Skye — The Old Man of Storr</figcaption>
            </figure>

            <figure>
              <img
                src="../assets/img/gallery/skye-neistpoint.jpg"
                alt="Isle of Skye — Neist Point lighthouse at sunset"
                loading="lazy"
              />
              <figcaption class="muted">Isle of Skye — Neist Point</figcaption>
            </figure>

            <figure>
              <img
                src="../assets/img/gallery/skye-redcuillins.jpg"
                alt="Isle of Skye — Red Cuillins mountain range with hairy coos"
                loading="lazy"
              />
              <figcaption class="muted">Isle of Skye — Red Cuillins</figcaption>
            </figure>

            <figure>
              <img
                src="../assets/img/gallery/skye-lochcoruisk.jpg"
                alt="Isle of Skye — Loch Coruisk at the foot of the Black Cuillin"
                loading="lazy"
              />
              <figcaption class="muted">Isle of Skye — Loch Coruisk</figcaption>
            </figure>

            <figure>
              <img
                src="../assets/img/gallery/skye-quiraing.jpg"
                alt="Isle of Skye — Quiraing geological landslip landscape"
                loading="lazy"
              />
              <figcaption class="muted">Isle of Skye — Quiraing</figcaption>
            </figure>

            <figure>
              <img
                src="../assets/img/gallery/skye-trotternish.jpg"
                alt="Isle of Skye — Trotternish ridge with dramatic sea cliffs and rugged terrain"
                loading="lazy"
              />
              <figcaption class="muted">Isle of Skye — Trotternish Ridge</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>

    <footer>
